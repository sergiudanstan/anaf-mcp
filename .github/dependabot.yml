version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot updates them while
  # keeping the pin, so pinning does not mean going stale. The project itself has
  # no dependency manifest (standard library only), so nothing else is tracked.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
