name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Se vede data.gov.ro de pe runner?
        run: |
          echo "--- DNS ---"; getent hosts data.gov.ro || echo "fara DNS"
          echo "--- HTTPS api (20s) ---"
          curl -sS -m 20 -o /dev/null -w "api: http=%{http_code} timp=%{time_total}s\n" \
            "https://data.gov.ro/api/3/action/package_search?q=test&rows=1" || echo "api: ESUAT"
          echo "--- HTTPS storage (20s) ---"
          curl -sS -m 20 -o /dev/null -w "storage: http=%{http_code} timp=%{time_total}s\n" \
            "https://data.gov.ro/" || echo "storage: ESUAT"
          echo "--- control: alt site ---"
          curl -sS -m 20 -o /dev/null -w "github: http=%{http_code}\n" https://api.github.com
