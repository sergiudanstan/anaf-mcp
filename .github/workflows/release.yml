name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: build, attest and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore OIDC for provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to release if the tag and the declared version disagree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(python3 -c "import re;print(re.search(r'^SERVER_VERSION = \"([^\"]+)\"', open('anaf_mcp.py').read(), re.M).group(1))")
          if [ "${TAG#v}" != "$declared" ]; then
            echo "tag $TAG does not match declared version $declared" >&2
            exit 1
          fi
          grep -q "^## \[$declared\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$declared] section" >&2; exit 1; }

      - name: Archive the source tree users actually run
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="${REPO}-${TAG}/" -o "dist/${REPO}-${TAG}.tar.gz" HEAD

      # GitHub-hosted Sigstore provenance; verify with
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # --latest=false: build-index.yml publishes the data releases "latest" and
          # "data-YYYY-MM"; the code releases (v*) must not take over GitHub's "Latest" badge.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --title "$TAG" \
            --notes "See CHANGELOG.md for details. Every artifact here carries build provenance; verify with: gh attestation verify <file> --repo $GITHUB_REPOSITORY" \
            dist/*
